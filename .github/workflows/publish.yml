# Turns installer pieces pushed to the "upload" branch into a public release.
name: Publish installers
on:
  push:
    branches: [upload]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upload
      - name: Join the pieces
        run: |
          mkdir out
          for f in StoryFlow-Setup-Windows.exe StoryFlow-Mac-AppleSilicon.dmg StoryFlow-Mac-Intel.dmg; do
            cat parts/$f.part* > out/$f
          done
          (cd out && sha256sum -c ../parts/SHA256SUMS)
          ls -la out
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat parts/VERSION)
          gh release delete "v$V" --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true
          gh release create "v$V" out/* -R "$GITHUB_REPOSITORY" --target main --latest \
            --title "Story Flow $V" \
            --notes "Windows 10/11: StoryFlow-Setup-Windows.exe · Mac with M1 or newer: StoryFlow-Mac-AppleSilicon.dmg · Older Intel Mac: StoryFlow-Mac-Intel.dmg. Buy a license at https://onelegacymedia.com/storyflow"
      - name: Remove the pieces
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --delete upload
